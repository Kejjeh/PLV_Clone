name: Daily full refresh (self-hosted)

# Runs the FULL pipeline once a day on a self-hosted runner installed on
# Josh's PC: statcast pull -> rh3/rp3/rprs2 model retrain -> all dashboards
# -> publish xfp-model (GitHub Pages). This is the heavy job that keeps the
# projection NUMBERS fresh; the cloud live-matchup job only refreshes
# rosters/scores on top of these committed projections.
#
# It runs in Josh's real working tree (C:\Users\Joshua\plv_clone), NOT a fresh
# checkout, so refresh_dashboards.py's existing hardcoded ROOT, the sibling
# xfp-model repo, the local .env, and saved git credentials all work exactly
# as they do when run by hand.
#
# Schedule: 11:00 UTC = 07:00 ET (EDT) / 06:00 ET (EST). A missed run (PC off)
# queues and executes when the runner next comes online.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
        working-directory: C:\Users\Joshua\plv_clone
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Diagnostics (python + git on the runner's PATH)
        run: |
          Write-Host "python: $((Get-Command python).Source)"
          python --version
          git --version
          git rev-parse --abbrev-ref HEAD

      - name: Pre-publish test gate (a red suite blocks the refresh)
        # WHY THIS STEP EXISTS (audit 2026-08-01 item 31)
        # Nothing anywhere ran pytest: the suite gated neither this nightly
        # publish nor a push to main, so a refresh could ship dashboards built
        # by code whose own tests were failing.
        #
        # A red suite must NOT cost the day's ESPN archival (transactions and
        # rosters roll off the API in 7-14 days, unrecoverable), and must NOT
        # publish dashboards built by red code. Both at once = exporting
        # SUITE_RED=1 and letting the refresh run with --no-push: data is
        # pulled and committed, the public site is untouched (review
        # 2026-08-01 - the first cut exited 1 here, which withheld the
        # archival commit too).
        #
        # The non-zero outcomes are NOT the same thing:
        #   exit 1   tests FAILED             -> SUITE_RED (archive, no publish)
        #   exit 2   interrupted/COLLECTION   -> SUITE_RED (a production import
        #            error lands here - it must never wave through)
        #   exit 3-5 pytest could NOT RUN     -> SUITE_RED (archive, no publish)
        #            (corrected 2026-08-27: exit 5 is "no tests collected",
        #            which is not a hiccup - it is the gate not running)
        #
        # `slow` (the real-subprocess triangulate pair, ~42% of suite wall) is
        # deselected; --no-cov -q override pyproject's addopts on the command
        # line so this needs no config edit.
        #
        # ESCAPE HATCH: a red suite blocks the nightly by design, so if a
        # data-dependent test ever goes red BECAUSE the data is stale, the two
        # would deadlock. Break it by running the refresh by hand
        # (`python scripts/xfp/refresh_dashboards.py`) - that path does not
        # consult this gate - and then fix the test.
        run: |
          python scripts/ci/run_summary.py -- python -m pytest -m "not slow" -q --no-cov
          $rc = $LASTEXITCODE
          if ($rc -eq 0) { exit 0 }
          if (($rc -eq 1) -or ($rc -eq 2)) {
            # exit 1 = tests failed; exit 2 = execution interrupted, which
            # INCLUDES a collection error - a syntax/import error in
            # production code MUST gate, or the nightly runs broken code
            # (review 2026-08-01). Neither may cost the day's ESPN archival
            # (transactions/rosters roll off the API in 7-14d and can never
            # be recovered), so the refresh still runs - with --no-push, so
            # nothing built by red code reaches the public dashboards.
            Write-Host "TEST GATE RED (pytest exit $rc) - data archival will run, but the publish is withheld."
            "SUITE_RED=1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          # exit 3 internal error / 4 usage error / 5 NO TESTS COLLECTED.
          # These used to wave the publish through as "a runner hiccup". That
          # was wrong about the mechanism: exit 5 means the suite did not run
          # AT ALL, and the reason given for not gating - that it "costs a day
          # of unrecoverable archival data" - is true of `exit 1` here, NOT of
          # SUITE_RED. SUITE_RED withholds only the publish; the refresh still
          # runs with --no-push and the data commit below has no `if:`, so the
          # ESPN archival is untouched either way (see the step below, which
          # says so itself).
          #
          # So "we could not verify the suite" now gets the same safe handling
          # as "the suite is red": archive everything, publish nothing. A
          # renamed marker, a pytest flag removed upstream, or a missing
          # pytest-cov plugin all land here - and each would otherwise publish
          # dashboards having run zero tests, which is exactly what this step
          # exists to prevent. Verified reachable 2026-08-27: an empty marker
          # selection exits 5, and `--no-cov` without pytest-cov exits 4.
          Write-Host "WARN: pytest could not run (exit $rc) - treating as RED. Archival continues; the publish is withheld until the suite can be verified."
          "SUITE_RED=1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          exit 0

      - name: Full refresh (statcast + models + dashboards + publish xfp-model)
        # SUITE_RED withholds only the xfp-model publish; every archival and
        # model step still runs and the data commit below still happens.
        run: |
          if ($env:SUITE_RED -eq '1') {
            Write-Host "suite is RED - running refresh with --no-push (archival continues, publish withheld)."
            python scripts/xfp/refresh_dashboards.py --no-push
          } else {
            python scripts/xfp/refresh_dashboards.py
          }
          exit $LASTEXITCODE

      - name: Surface a GATED publish (alert only - never gates)
        # WHY THIS STEP EXISTS (audit 2026-08-01 item 16)
        # refresh_dashboards.main() RETURNS when the publish gate trips - it
        # does not exit non-zero, and it must not: the "Commit & push
        # regenerated plv_clone data" step below carries no `if:`, so a
        # non-zero exit would silently drop a day of ESPN transaction/roster
        # archival that rolls off the API in 7-14 days and can never be
        # recovered. So a gated run used to look EXACTLY like a clean one -
        # green job, data committed, nobody told that every dashboard below
        # step 2 was rendered from yesterday's projections.
        #
        # The driver now writes .cache/PUBLISH_GATED on that path (and deletes
        # it on a clean one; .cache is gitignored so `git add data` below never
        # commits the marker). This step reads it and (a) exports
        # PUBLISH_GATED so the commit step can mark the commit forever, (b)
        # writes a job summary line so it lands in the Actions notification.
        # ALERT ONLY: terminal `exit 0` on every path.
        if: always()
        run: |
          $marker = '.cache/PUBLISH_GATED'
          $sum = $env:GITHUB_STEP_SUMMARY
          if (Test-Path $marker) {
            $when = (Get-Content $marker -Encoding UTF8 -TotalCount 1)
            "PUBLISH_GATED=1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            $msg = "PUBLISH GATED at ${when}: the model rebuild (step 2) failed, so nothing was pushed to xfp-model and every dashboard below step 2 carries STALE projections. The data commit in this run is stale too."
            if ($sum) {
              "## Publish gate" | Out-File $sum -Append -Encoding utf8
              "- **GATED** $msg" | Out-File $sum -Append -Encoding utf8
            }
            Write-Host $msg
          } else {
            Write-Host "publish gate clear - the model rebuild succeeded."
          }
          exit 0

      - name: Surface scorecard tripwire FAILs (alert only — never gates)
        # WHY THIS STEP EXISTS
        # build_model_scorecard.py already exits 1 when any data_health /
        # pipeline_staleness check FAILs — and that now includes the three drift
        # sentinels added 2026-07-29 (collision_team_reachability,
        # collision_smoke, fa_join_coverage). But it runs INSIDE
        # refresh_dashboards.py step 4.97, which is deliberately fail-soft, so
        # that exit code is swallowed into one line of a 140-minute log that
        # nobody reads. A sentinel FAIL means the name-collision / FA-join
        # machinery every board depends on has drifted, and it was silently
        # green-emailing.
        #
        # So: read the artifact the refresh just wrote, and (a) prepend a marker
        # to the commit message so the alert is visible in `git log` forever,
        # (b) write a job summary so it lands in the Actions notification.
        #
        # ALERT ONLY. `if: always()` + a terminal `exit 0` on every path: the
        # data work must still commit even if this detection breaks. It reads a
        # CSV; it must never be the reason a refresh loses a day of data.
        if: always()
        run: |
          # 'Stop' (GitHub's default for shell: powershell) so a bad CSV becomes a
          # TERMINATING error the catch below actually sees, instead of a warning
          # that lets the step continue with $rows silently empty and report a
          # false all-clear.
          $ErrorActionPreference = 'Stop'
          $csv = 'data/outputs/model_scorecard.csv'
          $sum = $env:GITHUB_STEP_SUMMARY
          $sentinels = @('collision_team_reachability', 'collision_smoke', 'fa_join_coverage')
          $lines = @()
          $marker = ''
          try {
            if (-not (Test-Path $csv)) {
              # NOT an all-clear: say the check could not run.
              $lines += "- COULD NOT CHECK: $csv is absent (step 4.97 runs Mondays only)."
            } else {
              $rows  = Import-Csv $csv
              $trip  = $rows | Where-Object { $_.section -eq 'data_health' -or $_.section -eq 'pipeline_staleness' }
              $fails = $trip | Where-Object { $_.status -eq 'FAIL' }
              $warns = $trip | Where-Object { $_.status -eq 'WARN' }
              $asof  = ($rows | ForEach-Object { $_.date } | Sort-Object | Select-Object -Last 1)
              $nf = @($fails).Count
              $nw = @($warns).Count
              $sentFails = @($fails | Where-Object { $sentinels -contains $_.metric })
              $ns = $sentFails.Count
              $lines += "- scorecard as-of ${asof}: $nf FAIL, $nw WARN (data_health + pipeline_staleness)"
              foreach ($f in $fails) {
                $kind = 'TRIPWIRE FAIL'
                if ($sentinels -contains $f.metric) { $kind = 'DRIFT SENTINEL FAIL' }
                $lines += "- **$kind** ``$($f.metric)`` ($($f.segment)): $($f.note)"
              }
              foreach ($w in $warns) {
                $lines += "- WARN ``$($w.metric)`` ($($w.segment)): $($w.note)"
              }
              # Roll call: a sentinel with NO ROW is not a pass. Sentinels landed
              # 2026-07-29, so an older scorecard legitimately lacks them.
              foreach ($s in $sentinels) {
                if (-not ($rows | Where-Object { $_.metric -eq $s })) {
                  $lines += "- NOTE: sentinel ``$s`` has NO ROW in this scorecard (did not run, or the scorecard predates 2026-07-29) - that is NOT a PASS"
                }
              }
              if ($ns -gt 0) {
                $marker = "ALERT[$ns sentinel FAIL] "
              } elseif ($nf -gt 0) {
                $marker = "ALERT[$nf tripwire FAIL] "
              }
              # AGE CHECK (audit 2026-08-01 item 26). Step 4.97 writes this CSV
              # on MONDAYS only, and the marker above is set purely off FAIL
              # counts - so one Monday FAIL was re-reported as tonight's news
              # for up to six consecutive nights (commit 0eb473a re-alerted the
              # 07-30 scorecard on 07-31). Threshold is 2 days, not 1: reading
              # Monday's file on Tuesday is the NORMAL case, and suppressing
              # that would silence every real FAIL. Parsing sits inside the
              # existing try{} so a malformed date lands in the catch.
              $asofDate = [datetime]::MinValue
              if (-not [datetime]::TryParse($asof, [ref]$asofDate)) {
                # Unparseable as-of date = age genuinely UNKNOWN, which is the
                # one case the guard must also suppress: an alert of unknown
                # age is exactly the maybe-stale re-report the guard exists to
                # stop (review 2026-08-01).
                $lines += "- COULD NOT CHECK: the scorecard's as-of date '$asof' does not parse, so its age is UNKNOWN. NOT an all-clear - re-run build_model_scorecard.py to know."
                $marker = ''
              } else {
                $age = ((Get-Date).Date - $asofDate.Date).Days
                if ($age -gt 2) {
                  $lines += "- COULD NOT CHECK: the scorecard is $age days old (as-of $asof) and step 4.97 runs Mondays only, so the FAIL/WARN lines above describe THAT day, not tonight. NOT an all-clear - re-run build_model_scorecard.py to know."
                  $marker = ''
                }
              }
            }
          } catch {
            $lines += "- ALERT DETECTION ITSELF FAILED: $($_.Exception.Message) (data work unaffected)"
          }
          "SCORECARD_ALERT=$marker" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if ($sum) {
            "## Model scorecard tripwires" | Out-File $sum -Append -Encoding utf8
            if ($marker) { "**$($marker.Trim())**" | Out-File $sum -Append -Encoding utf8 }
            $lines | Out-File $sum -Append -Encoding utf8
          }
          $lines | ForEach-Object { Write-Host $_ }
          exit 0

      - name: Surface playing-time (volume) alerts (alert only — never gates)
        # WHY THIS STEP EXISTS
        # The volume models already ACCOUNT for role change; nothing TOLD Josh
        # about it. /volume-watch is on-demand, so on 2026-08-01 Matt Chapman
        # sat at ZERO PA over 21 days while rh3's naive expected_pa_remaining
        # still projected him a full-time 3.20 PA/team-game — and no surface
        # said a word. Step 4.945 now writes data/outputs/volume_alerts.csv;
        # this reads it and prepends a marker so a role collapse is legible in
        # `git log` forever.
        #
        # Only ROLE_LOSS (a player Josh OWNS losing playing time) sets the
        # marker. ROLE_GAIN is an FA opportunity — worth reporting in the job
        # summary, not worth an alert prefix. IL_ZERO is already visible in
        # ESPN and /roster-audit, so it is summarised but never marks.
        #
        # ALERT ONLY: `if: always()` + terminal `exit 0` on every path.
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $csv = 'data/outputs/volume_alerts.csv'
          $sum = $env:GITHUB_STEP_SUMMARY
          $lines = @()
          $marker = ''
          try {
            if (-not (Test-Path $csv)) {
              # NOT an all-clear: the detector did not run.
              $lines += "- COULD NOT CHECK: $csv is absent (step 4.945 did not run or bailed early). NOT an all-clear."
            } else {
              $rows = @(Import-Csv $csv)
              # NOTE: a scriptblock predicate ({ $_.is_new -eq 'True' }) works
              # in Where-Object but NOT when invoked with & inside a foreach --
              # $_ is unbound there and every row silently reads the same way.
              # First cut labelled a genuinely NEW loss as "(ongoing)". Use an
              # explicit per-row property test.
              $loss = @($rows | Where-Object { $_.signal -eq 'ROLE_LOSS' })
              $gain = @($rows | Where-Object { $_.signal -eq 'ROLE_GAIN' })
              $il   = @($rows | Where-Object { $_.signal -eq 'IL_ZERO' })
              # Only a TRANSITION marks the commit. A benching that persists
              # for six weeks must not re-page for six weeks, or the prefix
              # stops meaning anything and gets ignored.
              $lossNew = @($loss | Where-Object { "$($_.is_new)" -match '^(?i)true$' })
              $ilNew   = @($il   | Where-Object { "$($_.is_new)" -match '^(?i)true$' })
              $lines += "- volume alerts: $($loss.Count) ROLE_LOSS ($($lossNew.Count) NEW), $($gain.Count) ROLE_GAIN (FA), $($il.Count) IL_ZERO ($($ilNew.Count) NEW)"
              foreach ($r in $loss) {
                $tag = if ("$($r.is_new)" -match '^(?i)true$') { '**ROLE LOSS (NEW)**' } else { 'role loss (ongoing)' }
                $lines += "- $tag ``$($r.player_name)`` [$($r.side)] ($($r.team)): season $([math]::Round([double]$r.season_pace,2)) -> recent $([math]::Round([double]$r.recent_pace,2)) $($r.unit)/team-game (L21 $($r.events_last21))"
              }
              foreach ($r in $ilNew) {
                $lines += "- **NEW IL** ``$($r.player_name)`` [$($r.side)]: recent volume went to zero and he is IL-flagged"
              }
              foreach ($r in ($gain | Select-Object -First 8)) {
                $lines += "- FA role gain ``$($r.player_name)`` [$($r.side)] ($($r.team)): recent $([math]::Round([double]$r.recent_pace,2)) vs season $([math]::Round([double]$r.season_pace,2)) $($r.unit)/team-game"
              }
              if ($lossNew.Count -gt 0) { $marker = "ALERT[$($lossNew.Count) role loss] " }
              elseif ($ilNew.Count -gt 0) { $marker = "ALERT[$($ilNew.Count) new IL] " }
            }
          } catch {
            $lines += "- VOLUME ALERT DETECTION ITSELF FAILED: $($_.Exception.Message) (data work unaffected)"
          }
          "VOLUME_ALERT=$marker" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if ($sum) {
            "## Playing-time (volume) alerts" | Out-File $sum -Append -Encoding utf8
            if ($marker) { "**$($marker.Trim())**" | Out-File $sum -Append -Encoding utf8 }
            $lines | Out-File $sum -Append -Encoding utf8
          }
          $lines | ForEach-Object { Write-Host $_ }
          exit 0

      - name: Commit & push regenerated plv_clone data
        run: |
          git add data
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $stamp = Get-Date -Format 'yyyy-MM-dd'
            # Tripwire marker from the alert step above (empty when all clear),
            # so a FAIL is legible in `git log` and not only in a run page.
            $alert = $env:SCORECARD_ALERT
            # Playing-time marker (step above). Concatenated rather than
            # replacing: a scorecard tripwire and a role collapse are
            # independent failures and both must survive into `git log`.
            $alert = $alert + $env:VOLUME_ALERT
            # A gated publish means these CSVs came off yesterday's models.
            # Say so in the commit itself - `git log` is the only place this
            # is still legible weeks later.
            if ($env:PUBLISH_GATED -eq '1') { $alert = "GATED[stale models] " + $alert }
            # BRANCH-AWARE (root-caused 2026-07-21): this job runs in Josh's
            # live working tree, which usually sits on a FEATURE branch. The
            # old `pull --rebase origin main` + `push origin main` combo (a)
            # rebased the feature branch onto main, re-hashing every already-
            # pushed branch commit (the recurring nightly divergence), and (b)
            # pushed the stale local `main` ref, so the job's own commit never
            # landed anywhere. Always reconcile + push the CURRENT branch.
            $branch = git branch --show-current
            if (-not $branch) {
              Write-Host "WARN: detached HEAD - skipping commit/push, reconcile manually."
              exit 0
            }
            git commit -m "${alert}refresh: daily auto-refresh $stamp"
            git fetch origin $branch
            if ($LASTEXITCODE -eq 0) {
              git pull --rebase --autostash origin $branch
              if ($LASTEXITCODE -ne 0) {
                # Fail-soft: keep the commit local and say so loudly. Never
                # fall back to -X ours merges - that silently mangles history.
                git rebase --abort
                Write-Host "WARN: rebase onto origin/$branch failed - commit left LOCAL for manual reconcile."
                exit 0
              }
            }
            git push origin HEAD
          } else {
            Write-Host "No data changes to commit."
          }

      - name: Job summary (traceability)
        # Purely additive: never touches the push logic. Surfaces, on the run's
        # Actions page, whether the job's commit actually LANDED on origin - the
        # exact failure mode that was silently emailing red (push rejected, work
        # done locally but never pushed). `always()` so it reports even if an
        # earlier step failed.
        if: always()
        run: |
          $head   = (git rev-parse --short HEAD)
          $branch = (git branch --show-current)
          $remote = (git rev-parse --short "origin/$branch" 2>$null)
          $sum = $env:GITHUB_STEP_SUMMARY
          if ($sum) {
            "## Daily full refresh"        | Out-File $sum -Append -Encoding utf8
            "- branch: $branch @ $head"    | Out-File $sum -Append -Encoding utf8
            "- origin/${branch}: $remote"    | Out-File $sum -Append -Encoding utf8
            if ($head -eq $remote) {
              "- OK: local HEAD is on origin (push landed)"                         | Out-File $sum -Append -Encoding utf8
            } else {
              "- WARN: local HEAD NOT on origin (commit left local or push failed)" | Out-File $sum -Append -Encoding utf8
            }
          }
