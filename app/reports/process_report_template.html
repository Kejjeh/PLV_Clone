<script type="text/babel">
// ═══ Constants ════════════════════════════════════════════════════════════════
const TABS = ['hitters','pitchers','targets','trends','waiver','my-team'];
const TAB_LABELS = { hitters:'Hitters', pitchers:'Pitchers', targets:'Targets',
                     trends:'Trends', waiver:'Waiver', 'my-team':'My Team' };
const POS_OPTIONS = ['C','1B','2B','3B','SS','OF','DH'];
const MONO  = '"IBM Plex Mono", ui-monospace, monospace';
const SERIF = '"Source Serif 4", "Source Serif Pro", "Iowan Old Style", Georgia, serif';

// ═══ Utilities ════════════════════════════════════════════════════════════════
const fmt = (n, d = 1) => {
  if (n === '—' || n == null) return '—';
  if (typeof n !== 'number') return n;
  if (Number.isNaN(n)) return '—';
  return n.toFixed(d);
};

function Sparkline({ data, width = 60, height = 20, color = 'currentColor', strokeWidth = 1.2, fill = false }) {
  if (!data || data.length === 0) return null;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;
  const step = width / (data.length - 1);
  const pts = data.map((v, i) => `${i * step},${height - ((v - min) / range) * height}`).join(' ');
  const last = data[data.length - 1];
  const lastY = height - ((last - min) / range) * height;
  const trend = data[data.length - 1] - data[Math.max(0, data.length - 4)];
  const lineColor = trend > 2 ? 'var(--pos)' : trend < -2 ? 'var(--neg)' : color;
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{ display: 'block', overflow: 'visible' }}>
      {fill && <polygon points={`0,${height} ${pts} ${width},${height}`} fill={lineColor} opacity={0.15} />}
      <polyline points={pts} fill="none" stroke={lineColor} strokeWidth={strokeWidth} strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={width} cy={lastY} r={1.6} fill={lineColor} />
    </svg>
  );
}

function Histogram({ bins, mean, label, highlightPct, color = 'currentColor', height = 60, width = 200 }) {
  if (!bins || bins.length === 0) return null;
  const max = Math.max(...bins);
  const bw = width / bins.length;
  return (
    <svg width={width} height={height + 24} viewBox={`0 0 ${width} ${height + 24}`} style={{ display: 'block' }}>
      <text x={width / 2} y={11} textAnchor="middle" fontSize="9" fill="currentColor" opacity="0.65" style={{ fontFamily: 'inherit' }}>
        {label} · μ={mean}
      </text>
      {bins.map((v, i) => {
        const h = (v / (max || 1)) * height;
        const isHighlight = highlightPct != null && Math.abs((i / bins.length) - highlightPct) < (1 / bins.length / 1.5);
        return (
          <rect key={i} x={i * bw + 0.5} y={height - h + 16} width={bw - 1} height={h}
            fill={isHighlight ? 'var(--accent)' : color} opacity={isHighlight ? 1 : 0.55} />
        );
      })}
    </svg>
  );
}

function dataCell(colors, color) {
  return {
    padding: '7px 8px', textAlign: 'right',
    fontFamily: MONO, fontSize: 11, fontVariantNumeric: 'tabular-nums',
    color: color || colors.text,
  };
}

function editorialBtn(colors) {
  return {
    padding: '5px 10px', fontSize: 10, fontFamily: MONO, letterSpacing: 1.2,
    background: colors.panel, color: colors.text,
    border: `1px solid ${colors.border}`, borderRadius: 2,
    cursor: 'pointer', textTransform: 'uppercase', fontWeight: 500,
  };
}

function makeEditorialHeat(dark) {
  return (v, min, max) => {
    if (typeof v !== 'number' || Number.isNaN(v)) return 'transparent';
    const t = Math.max(0, Math.min(1, (v - min) / (max - min)));
    if (dark) {
      return t < 0.5
        ? `oklch(${0.22 + (1 - t * 2) * 0.02} 0 0 / 0)`
        : `oklch(0.55 ${0.04 + (t - 0.5) * 0.18} 35 / ${0.10 + (t - 0.5) * 0.40})`;
    }
    return t < 0.5
      ? `oklch(0.97 0 0 / 0)`
      : `oklch(0.65 ${0.04 + (t - 0.5) * 0.20} 35 / ${0.06 + (t - 0.5) * 0.30})`;
  };
}

const initials = (n) => n ? n.split(' ').map(w => w[0] + '.').join(' ') : '—';
const lastName = (n) => n ? n.split(' ').pop() : '—';

function exportCSV(rows, cols, filename = 'process_report.csv') {
  const escape = v => {
    if (v == null || v === '—') return '';
    const s = String(v);
    return s.includes(',') || s.includes('"') ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const header = cols.join(',');
  const body = rows.map(r => cols.map(c => escape(r[c])).join(',')).join('\n');
  const blob = new Blob([header + '\n' + body], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// ═══ Sortable header cell ═════════════════════════════════════════════════════
function SortTh({ col, label, align = 'r', width, sortCol, sortDir, onSort, colors, sticky = false, left = 0 }) {
  const active = sortCol === col;
  return (
    <th onClick={() => onSort(col)} style={{
      textAlign: align === 'l' ? 'left' : 'right', padding: '8px 8px',
      fontSize: 9, fontWeight: 600, letterSpacing: 1.5, textTransform: 'uppercase',
      fontFamily: MONO, whiteSpace: 'nowrap', minWidth: width,
      cursor: 'pointer', userSelect: 'none',
      color: active ? colors.accent : colors.dim,
      background: colors.bg,
      position: sticky ? 'sticky' : 'static', left: sticky ? left : 'auto',
      zIndex: sticky ? 2 : 1,
    }}>
      {label}{active ? (sortDir === 'desc' ? ' ↓' : ' ↑') : ''}
    </th>
  );
}

// ═══ Hitters Table (also reused by Waiver and My Team) ════════════════════════
function HittersTable({ rows, colors, editorialHeat, selected, setSelected, expanded, setExpanded,
                        pinned, setPinned, sortCol, sortDir, onSort, lastColLabel = 'Risk', renderLastCell }) {
  return (
    <div style={{ overflow: 'auto' }}>
      <table style={{ width: '100%', borderCollapse: 'collapse', fontVariantNumeric: 'tabular-nums' }}>
        <thead>
          <tr style={{ borderBottom: `2px solid ${colors.text}` }}>
            <SortTh col="rank"    label="Rk"      align="l" width={36}  sortCol={sortCol} sortDir={sortDir} onSort={onSort} colors={colors} />
            <SortTh col="name"    label="Player"  align="l" width={150} sortCol={sortCol} sortDir={sortDir} onSort={onSort} colors={colors} sticky left={36} />

            <SortTh col="fpos"    label="FPos"    width={60}  sortCol={sortCol} sortDir={sortDir} onSort={onSort} colors={colors} />
            <SortTh col="proc"    label="Proc+"   width={56}  sortCol={sortCol} sortDir={sortDir} onSort={onSort} colors={colors} />
            <th style={{ textAlign:'right', padding:'8px 8px', fontSize:9, color:colors.dim, fontWeight:600, letterSpacing:1.5, textTransform:'uppercase', fontFamily:MONO }}>12W</th>
            <SortTh col="procPos" label="ProcPos" width={56}  sortCol={sortCol} sortDir={sortDir} onSort={onSort} colors={colors} />
            <SortTh col="kavoid"  label="K-Avd+"  width={56}  sortCol={sortCol} sortDir={sortDir} onSort={onSort} colors={colors} />
            <SortTh col="power"   label="Power+"  width={56}  sortCol={sortCol} sortDir={sortDir} onSort={onSort} colors={colors} />
            <SortTh col="swing"   label="Swg%"    width={44}  sortCol={sortCol} sortDir={sortDir} onSort={onSort} colors={colors} />
            <SortTh col="chase"   label="Chs%"    width={44}  sortCol={sortCol} sortDir={sortDir} onSort={onSort} colors={colors} />
            <SortTh col="mc"      label="MC"      width={50}  sortCol={sortCol} sortDir={sortDir} onSort={onSort} colors={colors} />
            <SortTh col="mci"     label="MCi"     width={50}  sortCol={sortCol} sortDir={sortDir} onSort={onSort} colors={colors} />
            <SortTh col="blast"   label="Blast"   width={44}  sortCol={sortCol} sortDir={sortDir} onSort={onSort} colors={colors} />
            <SortTh col="ev"      label="EV"      width={40}  sortCol={sortCol} sortDir={sortDir} onSort={onSort} colors={colors} />
            <SortTh col="fpTotal"   label="FP"    width={48}  sortCol={sortCol} sortDir={sortDir} onSort={onSort} colors={colors} />
            <SortTh col="fpPerGame" label="FP/G"  width={48}  sortCol={sortCol} sortDir={sortDir} onSort={onSort} colors={colors} />
            <SortTh col="signal"  label="Signal"  width={70}  sortCol={sortCol} sortDir={sortDir} onSort={onSort} colors={colors} />
            <th style={{ textAlign:'right', padding:'8px 8px', fontSize:9, color:colors.dim, fontWeight:600, letterSpacing:1.5, textTransform:'uppercase', fontFamily:MONO, minWidth:90 }}>{lastColLabel}</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((h, idx) => {
            const isSel = selected === h.name;
            const isExp = expanded === h.name;
            const rowBg = isSel ? colors.panel : 'transparent';
            return (
              <React.Fragment key={`${h.name}-${idx}`}>
                <tr onClick={() => setSelected(h.name)}
                    onDoubleClick={() => setExpanded(isExp ? null : h.name)}
                    style={{ borderBottom: `1px solid ${colors.faint}`, background: rowBg, cursor: 'pointer' }}>
                  <td style={{ padding: '7px 8px', fontSize: 16, fontFamily: SERIF, fontStyle: 'italic',
                               color: idx < 3 ? colors.accent : colors.dim, width: 36 }}>{idx + 1}</td>
                  <td style={{ padding:'7px 8px', position:'sticky', left:36,
                               background: rowBg === 'transparent' ? colors.bg : rowBg,
                               whiteSpace:'nowrap', width:150, zIndex:1 }}>
                    <span onClick={(e) => { e.stopPropagation();
                      setPinned(pinned.includes(h.name) ? pinned.filter(x => x !== h.name) : [...pinned, h.name]); }}
                      style={{ color: pinned.includes(h.name) ? colors.accent : colors.faint,
                               marginRight: 6, cursor: 'pointer', fontSize: 11 }}>★</span>
                    <span style={{ fontSize: 14, fontWeight: 500 }}>{h.name}</span>
                  </td>
                  <td style={dataCell(colors, h.pa < 100 ? colors.dim : colors.text)}>{h.pa}</td>
                  <td style={dataCell(colors, colors.dim)}>{h.pos}</td>
                  <td style={{ ...dataCell(colors, colors.dim), fontSize: 10 }}>{h.fpos}</td>
                  <td style={{ padding: '5px 8px', textAlign:'right', background: editorialHeat(h.proc, 100, 150) }}>
                    <span style={{ fontSize: 18, fontFamily: SERIF, fontStyle: 'italic', color: colors.accent }}>{fmt(h.proc, 1)}</span>
                  </td>
                  <td style={{ padding: '5px 8px' }}>
                    <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
                      <Sparkline data={window.SPARKS[h.name]} width={56} height={16} color={colors.dim} strokeWidth={1.2} />
                    </div>
                  </td>
                  <td style={{ ...dataCell(colors), background: editorialHeat(h.procPos, 100, 170) }}>{fmt(h.procPos, 1)}</td>
                  <td style={{ ...dataCell(colors), background: editorialHeat(h.kavoid, 85, 130) }}>{fmt(h.kavoid, 1)}</td>
                  <td style={{ ...dataCell(colors), background: editorialHeat(h.power, 120, 170) }}>{fmt(h.power, 1)}</td>
                  <td style={dataCell(colors, colors.dim)}>{fmt(h.swing, 1)}</td>
                  <td style={dataCell(colors, colors.dim)}>{fmt(h.chase, 1)}</td>
                  <td style={dataCell(colors)}>{fmt(h.mc, 3)}</td>
                  <td style={dataCell(colors)}>{fmt(h.mci, 3)}</td>
                  <td style={dataCell(colors, typeof h.blast === 'number' && h.blast >= 17 ? colors.pos : colors.text)}>{fmt(h.blast)}</td>
                  <td style={dataCell(colors)}>{fmt(h.ev)}</td>
                  <td style={{ ...dataCell(colors), background: editorialHeat(h.fpTotal, 30, 250) }}>
                    {typeof h.fpTotal === 'number' ? Math.round(h.fpTotal) : '—'}
                  </td>
                  <td style={dataCell(colors, colors.dim)}>{fmt(h.fpPerGame, 2)}</td>
                  <td style={{ padding: '7px 8px', textAlign: 'right' }}>
                    <span style={{ fontSize: 11, fontFamily: SERIF, fontStyle: 'italic',
                                   color: h.signal === 'Top Target' ? colors.pos : colors.dim }}>
                      {h.signal === 'Top Target' ? '“ buy ”' : `“ ${(h.signal || '').toLowerCase() || '—'} ”`}
                    </span>
                  </td>
                  <td style={{ padding: '7px 8px', textAlign: 'right', fontSize: 10, fontFamily: MONO, letterSpacing: 0.3 }}>
                    {renderLastCell ? renderLastCell(h, colors) : (
                      h.flag && h.flag !== '—'
                        ? <span style={{ padding:'1px 6px', border:`1px solid ${colors.warn}`, color:colors.warn, textTransform:'uppercase', whiteSpace:'nowrap' }}>⚑ {h.flag.split(',')[0].trim()}</span>
                        : <span style={{ color: colors.faint }}>—</span>
                    )}
                  </td>
                </tr>
                {isExp && (
                  <tr>
                    <td colSpan={20} style={{ padding:'14px 24px', background:colors.stripe, borderBottom:`1px solid ${colors.faint}` }}>
                      <div style={{ display:'grid', gridTemplateColumns:'1.2fr 1fr 1fr', gap:24 }}>
                        <div>
                          <div style={{ fontSize:9, letterSpacing:2, textTransform:'uppercase', color:colors.dim, fontFamily:MONO, marginBottom:6 }}>12-week trajectory</div>
                          <Sparkline data={window.SPARKS[h.name]} width={240} height={48} color={colors.accent} fill strokeWidth={1.4} />
                        </div>
                        <div>
                          <div style={{ fontSize:9, letterSpacing:2, textTransform:'uppercase', color:colors.dim, fontFamily:MONO, marginBottom:6 }}>ESPN scoring</div>
                          <div style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:'4px 12px' }}>
                            {[
                              ['Total FP', typeof h.fpTotal === 'number' ? Math.round(h.fpTotal) : '—'],
                              ['Per Game', fmt(h.fpPerGame, 2)],
                              ['Projected', typeof h.fpProj === 'number' ? Math.round(h.fpProj) : '—'],
                              ['Games', h.gp || '—'],
                              ['% Owned', typeof h.pctOwned === 'number' ? `${h.pctOwned.toFixed(0)}%` : '—'],
                              ['Status', h.espnStatus === 'ROSTER' ? (h.onTeam || 'Rostered') : (h.espnStatus || '—')],
                            ].map(([lbl, val]) => (
                              <div key={lbl}>
                                <div style={{ fontSize:8, letterSpacing:2, color:colors.dim, fontFamily:MONO, textTransform:'uppercase' }}>{lbl}</div>
                                <div style={{ fontSize:13, fontFamily:MONO, color:colors.text }}>{val}</div>
                              </div>
                            ))}
                          </div>
                        </div>
                        <div style={{ display:'flex', alignItems:'center', justifyContent:'flex-end', gap:8 }}>
                          <button style={{ ...editorialBtn(colors), background: colors.accent, color: '#fff', borderColor: colors.accent }}>Full Player View →</button>
                          <button style={editorialBtn(colors)}>Add to Compare</button>
                        </div>
                      </div>
                    </td>
                  </tr>
                )}
              </React.Fragment>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ═══ Pitchers Table ═══════════════════════════════════════════════════════════

// ═══ Target card ══════════════════════════════════════════════════════════════
function TargetCard({ h, colors }) {
  const trendColor = h.rollingTrend === 'hot' ? colors.pos
                   : h.rollingTrend === 'warm' ? colors.warn
                   : h.rollingTrend === 'cold' ? colors.neg : colors.dim;
  const tag = (h.tag || '').toString();
  return (
    <div style={{ borderTop: `1px solid ${colors.faint}`, paddingTop: 10 }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
        <div style={{ fontStyle:'italic', fontFamily:SERIF, fontSize:20, color:colors.accent, lineHeight:1.1 }}>{h.name}</div>
        <span style={{ fontFamily:MONO, fontSize:9, color:trendColor, textTransform:'uppercase', letterSpacing:1, paddingTop:4 }}>
          ● {h.rollingTrend || '—'}
        </span>
      </div>
      <div style={{ fontFamily:MONO, fontSize:10, color:colors.dim, marginTop:3 }}>
        {h.pos || '—'} · {h.pa} PA · <span style={{ color: h.confidence === 'Signal' ? colors.pos : colors.warn }}>{h.confidence || '—'}</span>
      </div>
      <div style={{ display:'flex', gap:16, marginTop:8 }}>

// ═══ Trend Chart ══════════════════════════════════════════════════════════════
function TrendChart({ players, colors }) {
  const W = 680, H = 220, PAD = { top:16, right:16, bottom:36, left:44 };
  const cw = W - PAD.left - PAD.right;
  const ch = H - PAD.top - PAD.bottom;

  const allDates = [...new Set(
    players.flatMap(name => (window.ROLLING[name] || []).map(r => r.date))
  )].sort();

  if (allDates.length === 0) {
    return <div style={{ color: colors.dim, fontFamily: MONO, fontSize: 11 }}>No rolling data for selected players.</div>;
  }

  const xScale = i => PAD.left + (i / Math.max(1, allDates.length - 1)) * cw;
  const yMin = 70, yMax = 170;
  const yScale = v => PAD.top + ch - ((v - yMin) / (yMax - yMin)) * ch;

  const LINE_COLORS = [colors.accent, colors.pos, '#6b9fd4', '#c17b3f', '#9b6bbf'];

  return (
    <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{ display:'block', maxWidth:'100%' }}>
      {[80, 100, 120, 140, 160].map(v => (
        <g key={v}>
          <line x1={PAD.left} x2={W - PAD.right} y1={yScale(v)} y2={yScale(v)} stroke={colors.faint} strokeWidth={1} />
          <text x={PAD.left - 6} y={yScale(v) + 4} textAnchor="end" fontSize={9} fill={colors.dim} fontFamily={MONO}>{v}</text>
        </g>
      ))}
      <line x1={PAD.left} x2={W - PAD.right} y1={yScale(100)} y2={yScale(100)}
            stroke={colors.dim} strokeWidth={1} strokeDasharray="3 3" />

      {players.map((name, pi) => {
        const data = (window.ROLLING[name] || []).slice().sort((a, b) => a.date.localeCompare(b.date));
        if (!data.length) return null;
        const pts = data.map(r => {
          const xi = allDates.indexOf(r.date);
          return `${xScale(xi)},${yScale(Math.max(yMin, Math.min(yMax, r.score)))}`;
        }).join(' ');
        const lc = LINE_COLORS[pi % LINE_COLORS.length];
        const last = data[data.length - 1];
        const lxi = allDates.indexOf(last.date);
        const lly = yScale(Math.max(yMin, Math.min(yMax, last.score)));
        return (
          <g key={name}>
            <polyline points={pts} fill="none" stroke={lc} strokeWidth={1.8} strokeLinejoin="round" strokeLinecap="round" />
            <circle cx={xScale(lxi)} cy={lly} r={3} fill={lc} />
            <text x={xScale(lxi) + 6} y={lly + 4} fontSize={9} fill={lc} fontFamily={MONO}>{lastName(name)}</text>
          </g>
        );
      })}

      {allDates.filter((_, i) => i % Math.max(1, Math.floor(allDates.length / 6)) === 0).map(d => {
        const i = allDates.indexOf(d);
        return (
          <text key={d} x={xScale(i)} y={H - PAD.bottom + 14} textAnchor="middle"
            fontSize={8} fill={colors.dim} fontFamily={MONO}>{d.slice(5)}</text>
        );
      })}
    </svg>
  );
}

              <>
                <SectionLabel>{window.MY_TEAM.teamName || 'My Team'} · {teamRows.length} top hitters</SectionLabel>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(5, 1fr)', gap:24 }}>
                  {teamRows.map(h => <Card key={`t-${h.name}`} h={h} />)}
                </div>
              </>
            )}
          </div>
        );
      })()}

      {/* Section nav */}
      <div style={{ padding:'10px 32px', borderBottom:`1px solid ${colors.border}`, display:'flex', gap:24, fontSize:10, letterSpacing:2, textTransform:'uppercase', fontFamily:MONO, alignItems:'center', flexWrap:'wrap' }}>
        {TABS.map(t => (
          <span key={t} onClick={() => setActiveTab(t)} style={{
            color: activeTab === t ? colors.text : colors.dim,
            fontWeight: activeTab === t ? 600 : 400,
            cursor: 'pointer',
            borderBottom: activeTab === t ? `2px solid ${colors.accent}` : 'none',
            paddingBottom: 4, marginBottom: -11,
          }}>{TAB_LABELS[t]}</span>
        ))}
        <div style={{ flex:1 }} />
        <span style={{ color:colors.dim }}>Presets:</span>
        {PRESETS.map((p, i) => (
          <span key={p.label} onClick={p.apply} style={{
            color: i === 0 ? colors.accent : colors.dim, cursor:'pointer',
            borderBottom: i === 0 ? `1px solid ${colors.accent}` : 'none', paddingBottom:2,
          }}>{p.label}</span>
        ))}
        <span style={{ color:colors.dim, cursor:'pointer' }}>+ New</span>
      </div>

      {/* Watchlist strip */}
      <div style={{ padding:'12px 32px', borderBottom:`1px solid ${colors.border}`, display:'flex', gap:16, alignItems:'center', flexWrap:'wrap' }}>
        <span style={{ fontSize:9, letterSpacing:2, textTransform:'uppercase', color:colors.dim, fontFamily:MONO }}>★ Following</span>
        {pinned.map(p => {
          const h = window.HITTERS.find(x => x.name === p);
          if (!h) return null;
          return (
            <span key={p} onClick={() => setSelected(p)} style={{
              display:'inline-flex', gap:8, alignItems:'center', cursor:'pointer',
              padding:'4px 10px', borderRadius:2,
              background: selected === p ? colors.panel : 'transparent',
              border: `1px solid ${selected === p ? colors.accent : colors.border}`,
              whiteSpace:'nowrap',
            }}>
              <span style={{ fontStyle:'italic', fontSize:13 }}>{p}</span>
              <span style={{ fontFamily:MONO, fontSize:10, color:colors.accent }}>{fmt(h.proc, 1)}</span>
              <span onClick={(e) => { e.stopPropagation(); setPinned(pinned.filter(x => x !== p)); }}
                style={{ color:colors.faint, fontSize:12, lineHeight:1 }}>×</span>
            </span>
          );
        })}
        {pinned.length === 0 && (
          <span style={{ fontStyle:'italic', fontSize:12, color:colors.dim }}>None pinned. Click ★ on any row to follow.</span>
        )}
      </div>

      {/* Tab body */}
      {activeTab === 'hitters'  && renderHittersTab()}
      {activeTab === 'pitchers' && renderPitchersTab()}
      {activeTab === 'targets'  && renderTargetsTab()}
      {activeTab === 'trends'   && renderTrendsTab()}
      {activeTab === 'waiver'   && renderWaiverTab()}
      {activeTab === 'my-team'  && renderMyTeamTab()}
    </div>
  );
}

// ═══ Theme toggle + App root ══════════════════════════════════════════════════
function ThemeToggle({ dark, setDark }) {
  return (
    <div style={{
      position:'fixed', top:10, right:14, zIndex:100,
      display:'flex', gap:4, padding:3, borderRadius:6,
      background:'rgba(255,255,255,0.85)', border:'1px solid rgba(0,0,0,.1)',
      fontFamily:'monospace', fontSize:11,
    }}>
      {['Light', 'Dark'].map((m, i) => {
        const active = dark === (i === 1);
        return (
          <button key={m} onClick={() => setDark(i === 1)} style={{
            padding:'3px 10px', borderRadius:4, border:'none', cursor:'pointer',
            background: active ? '#1a1a1a' : 'transparent',
            color: active ? '#fff' : '#555', fontWeight:500, fontSize:11,
          }}>{m}</button>
        );
      })}
    </div>
  );
}

function App() {
  const [dark, setDark] = React.useState(false);
  const [tab, setTab]   = React.useState('hitters');
  const [pinned, setPinned] = React.useState(window.HITTERS.slice(0, 2).map(h => h.name).filter(Boolean));
  return (
    <div style={{ position:'relative', minHeight:'100vh' }}>
      <ThemeToggle dark={dark} setDark={setDark} />
      <VariantEditorialDense
        dark={dark}
        activeTab={tab}
        setActiveTab={setTab}
        pinned={pinned}
        setPinned={setPinned}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
