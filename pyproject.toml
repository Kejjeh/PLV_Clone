[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plv-clone"
version = "0.1.0"
description = "Unofficial public-data clone of PLV and Process+ baseball metrics"
requires-python = ">=3.11"
dependencies = [
    "pybaseball>=2.2.7",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "duckdb>=0.10",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer[all]>=0.12",
    "streamlit>=1.32",
    "plotly>=5.0",
    "matplotlib>=3.8",
    "requests>=2.31",
    "espn-api>=0.35,<0.47",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[project.scripts]
plv = "plv_clone.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/plv_clone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-r sxX --cov --cov-report=term-missing -v"
markers = [
    "slow: end-to-end tests that run the real triangulate subprocess (deselect with -m 'not slow')",
]

[tool.coverage.run]
# Measure the whole production surface, not just the installed package —
# --cov=plv_clone alone covered ~11% of the codebase (the "~1% coverage" illusion).
source = ["plv_clone", "lib", "app"]

[tool.coverage.paths]
# Alias the import identities so `lib.*` (scripts/xfp on sys.path) and
# `plv_clone.*` (src layout / installed -e) each map to one canonical path.
plv_clone = ["src/plv_clone", "*/plv_clone"]
lib = ["scripts/xfp/lib", "*/xfp/lib"]
app = ["app", "*/app"]

[tool.ruff]
line-length = 100
target-version = "py311"
