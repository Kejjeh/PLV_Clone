[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plv-clone"
version = "0.1.0"
description = "Unofficial public-data clone of PLV and Process+ baseball metrics"
requires-python = ">=3.11"
dependencies = [
    "pybaseball>=2.2.7",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "duckdb>=0.10",
    "lightgbm>=4.3",
    # xgboost is imported by models/xfp/ceiling.py::_xgb_factory. It is a HARD
    # dependency, not optional: nonlinear_ceiling takes max(xgb_gap, rf_gap),
    # so degrading to RF-only would silently WEAKEN the /validate-feature
    # Rule 9 gate rather than fail it. Declared 2026-08-27.
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer[all]>=0.12",
    "streamlit>=1.32",
    "plotly>=5.0",
    "matplotlib>=3.8",
    "requests>=2.31",
    "espn-api>=0.35,<0.47",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[project.scripts]
plv = "plv_clone.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/plv_clone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Audit 2026-08-01 item 53: coverage is an explicit CI choice, not a tax on every
# invocation. Measured A/B on the same 43 tests AFTER the item-37 source fix
# below: 2.2s without the tracer, 11.3s with it (5.1x) — the tracer now sees
# 71,602 statements instead of 9,148, so forcing it on every `pytest tests/foo.py`
# costs far more than it did before. Hence: opt-in.
# `-r sxX` is LOAD-BEARING — it is what puts the data-gated skip reasons into the
# short-summary block scripts/ci/run_summary.py extracts. Invocations:
#   default    : python scripts/ci/run_summary.py -- python -m pytest
#   coverage   : python -m pytest --cov --cov-report=term-missing
#   pre-publish: python -m pytest -m ""      (re-includes the slow triangulate
#                parallel-vs-batch equivalence test that addopts deselects)
addopts = "-r sxX -m 'not slow'"
markers = [
    "slow: end-to-end tests that run the real triangulate subprocess (deselect with -m 'not slow')",
]

[tool.coverage.run]
# Audit 2026-08-01 item 37: these must be PATHS, not module names. Module-name
# entries only bind if that name is an import root, so "lib" measured nothing
# unless a test happened to `import lib.*` (observed: "Module lib was never
# imported" / "No data was collected"), and scripts/xfp — ~113k production lines,
# every engine the decision layer runs on — was structurally unmeasurable.
# Expect the reported percentage to DROP sharply against the old config. That is
# the honest number, not a regression.
source = ["src/plv_clone", "scripts/xfp", "app"]
omit = [
    # Dead / one-off trees, already .gitignore'd out of the CodeGraph index.
    "scripts/xfp/research/*",
    "scripts/xfp/_research/*",
    "scripts/xfp/archive/*",
    "scripts/xfp/_attic/*",
    "scripts/xfp/_oneoff/*",
    "scripts/xfp/_adhoc/*",
]

[tool.coverage.paths]
# Alias the import identities so `lib.*` (scripts/xfp on sys.path) and
# `plv_clone.*` (src layout / installed -e) each map to one canonical path.
plv_clone = ["src/plv_clone", "*/plv_clone"]
lib = ["scripts/xfp/lib", "*/xfp/lib"]
app = ["app", "*/app"]

[tool.ruff]
line-length = 100
target-version = "py311"
